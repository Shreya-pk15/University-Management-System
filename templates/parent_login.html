<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>
        function validateForm() {
            var studentId = document.getElementById('student_id').value;
            if (!/^\d{3}$/.test(studentId)) {
                alert('Student ID must be exactly 3 digits.');
                return false;
            }
            return true;
        }

        document.addEventListener('DOMContentLoaded', function() {
            var errorMsg = document.getElementById('error-msg').value;
            if (errorMsg) {
                alert(errorMsg);
                var signup = confirm('Would you like to sign up?');
                if (signup) {
                    window.location.href = "{{ url_for('parent_signup') }}";
                }
            }
        });
    </script>
</head>
<body>
     
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="University Logo" height="30">
            <B>ELITE ACADEMY</B>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('about') }}">About Us</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Campus Life
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="{{ url_for('housing_dining') }}">Housing & Dining</a>
                        <a class="dropdown-item" href="{{ url_for('health_wellness') }}">Health & Wellness</a>
                        <a class="dropdown-item" href="{{ url_for('campus_safety') }}">Campus Safety</a>
                        <a class="dropdown-item" href="{{ url_for('athletics') }}">Athletics</a>
                        <a class="dropdown-item" href="{{ url_for('arts_culture') }}">Arts & Culture</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('faculty') }}">Faculty</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
    <div class="login-container">
        <h2>Parent Login</h2>
        <form method="POST" action="{{ url_for('parent_login') }}" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" required>
                    <div class="input-group-append">
                        <span class="input-group-text" id="togglePassword">
                            <i class="fa fa-eye"></i>
                        </span>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn">Login</button>
            <input type="hidden" id="error-msg" value="{{ error_msg }}">
        </form>
    </div>


    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 <b>ELITE ACADEMY</b>. All rights reserved.</p>
            <p>Contact: <a href="tel:+123456789">+1 (234) 567-89</a> | <a href="mailto:info@example.com">info@example.com</a></p>
            <p>Follow us:
                <a href="#" class="text-white mx-1"><i class="fa fa-facebook"></i></a>
                <a href="#" class="text-white mx-1"><i class="fa fa-twitter"></i></a>
                <a href="#" class="text-white mx-1"><i class="fa fa-instagram"></i></a>
            </p>
        </div>
    
    
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
    var passwordField = document.getElementById('password');
    var icon = this.querySelector('i');

    // Toggle the type attribute of the password field
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        passwordField.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
});
    </script>
</body>
</html>
