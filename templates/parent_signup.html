<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>
        function validateForm() {
            var studentId = document.getElementById('student_id').value;
            if (!/^\d{3}$/.test(studentId)) {
                alert('Student ID must be exactly 3 digits.');
                return false;
            }
            return true;
        }
        function validateForm() {
            var phone = document.getElementById('phone').value;
            if (!/^\d{10}$/.test(phone)) {
                alert('Phone number must contain exactly 10 digits.');
                return false;
            }
            return true;
        }
    </script>

    <div class="auth-container">
        <h2>Parent SignUp</h2>
        <form method="POST" action="{{ url_for('parent_signup') }}">
            <div class="form-group">
                <label for="username">Username: <span class="required">*</span></label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" required>
                    <div class="input-group-append">
                        <span class="input-group-text" id="togglePassword">
                            <i class="fa fa-eye"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email: <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number: <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" required pattern="\d{10}" title="Phone number must contain exactly 10 digits">
            </div>
            <div class="form-group">
                <label for="student_id">Student ID: <span class="required">*</span></label>
                <input type="text" id="student_id" name="student_id" required pattern="\d{3}" title="Student ID must be exactly 3 digits">
            </div>
            <div class="form-group">
                <label for="student_name">Student Name: <span class="required">*</span></label>
                <input type="text" id="student_name" name="student_name" required>
            </div>
            <div class="form-group">
                <label for="parent_type">Parent Type: <span class="required">*</span></label>
                <select name="parent_type" id="parent_type" required>
                    <option value="mother">Mother</option>
                    <option value="father">Father</option>
                </select>
            </div>
            <button type="submit" class="btn">Signup</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script> 
<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        var passwordField = document.getElementById('password');
        var icon = this.querySelector('i');
    
        // Toggle the type attribute of the password field
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordField.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
</script>
